<section class="resume-section p-3 p-lg-5 d-flex flex-column" id="play">
  <div class="my-auto">
    {{ with $.GetPage "/play" }}
      <h2 class="mb-3"><a href="{{ .Permalink }}">{{ i18n "play" }}</a></h2>
      {{ .Content | replaceRE "<p>" "<p class=\"lead\">" | safeHTML }}
      {{ range .RegularPages.ByWeight }}
        <div class="resume-item mb-4">
          <h3 class="mb-0"><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
          <div>{{ .Params.description }}</div>
        </div>
      {{ end }}
    {{ end }}
  </div>
</section>
