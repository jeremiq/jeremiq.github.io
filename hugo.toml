baseURL = 'https://jeremiq.github.io/'
languageCode = 'en-us'
title = 'Jeremiah Edwards'
theme = 'hugo-resume'
PygmentsCodeFences = true
PygmentsCodeFencesGuessSyntax = true
PygmentsStyle = "xcode-dark"
enableGitInfo = true
[params.google]

[params.google.analytics]
trackerID = "G-B4Y7HCKNQ7"


[caches]
  [caches.images]
    dir = ':cacheDir/images'



[params]
address = "Boulder, CO"
email = "jeremiq@gmail.com"
favicon = "static/favicon.ico"
firstName = "Jeremiah"
lastName = "Edwards"
contactNote = "AI & Engineering Executive · Fractional CTO and AI Advisor"
description = "Jeremiah Edwards is an AI and engineering executive, and a fractional CTO and AI advisor, based in Boulder, CO."

#phone = "1-555-555-1234"
profileImage = "images/headshot.jpeg"
showQr = false
showContact = false
showBoards  = false
showCertifications = false
showSocializations = true
sections = ["publications", "skills", "education", "personal", "play"]

gitCommitPrefix = "https://github.com/jeremiq/jeremiq.github.io/commit"
[[params.handles]]
    name = "LinkedIn"
    link = "https://www.linkedin.com/in/jeremiq/"

[[params.handles]]
    name = "GitHub"
    link = "https://github.com/jeremiq/"

[outputs]
home = ["HTML", "JSON"]

[taxonomies]
tag = "tags"

# Leave \( ... \), \[ ... \] and $$ ... $$ untouched in Markdown so KaTeX can typeset them.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]
